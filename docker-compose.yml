services:
  mongo:
    image: mongo:7.0
    container_name: mongo
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes:
      - mongo-data:/data/db

  api:
    build:
      context: ./jwt-express-starter-code
      dockerfile: Dockerfile
    container_name: api
    environment:
      - JWT_SECRET=my secret string
      - MONGODB_URI=mongodb://mongo:27017/deloitte
      - PORT=3000
    ports: ["3000:3000"]
    volumes:
      - ./jwt-express-starter-code:/usr/src/app # bind-mount source
      - /usr/src/app/node_modules
    depends_on: [mongo]

volumes:
  mongo-data:
